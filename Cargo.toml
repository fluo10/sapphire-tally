[workspace]
members = ["server", "crates/sapphire-tally-core"]
default-members = ["server"]
resolver = "3"

[workspace.package]
description = "A stamp tracker with GitHub-style heatmaps built on sapphire-framework - file-based, local-first, made for human-agent collaboration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fluo10/sapphire-tally"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
grain-id = { version = "0.16", features = ["serde"] }
rmcp = { version = "1.5", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1" }
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.dev.package."*"]
opt-level = 1
